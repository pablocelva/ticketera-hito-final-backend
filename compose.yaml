services:
  db:
    image: postgres:16-alpine
    container_name: pg-ticketera
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketera_db
      POSTGRES_USER: user_ticketera
      POSTGRES_PASSWORD: pass_ticketera
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_ticketera -d ticketera_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    container_name: ticketera-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TICKETERA_DB_URL: jdbc:postgresql://db:5432/ticketera_db
      TICKETERA_DB_USERNAME: user_ticketera
      TICKETERA_DB_PASSWORD: pass_ticketera
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

volumes:
  postgres_data: