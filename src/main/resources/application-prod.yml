spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${TICKETERA_DB_URL}
    username: ${TICKETERA_DB_USERNAME}
    password: ${TICKETERA_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
        
server:
  port: ${SERVER_PORT:8081}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}